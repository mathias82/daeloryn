name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-security.txt -r requirements-code-analysis.txt
      - name: Validate agent definitions
        run: python scripts/agents.py validate
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  java-compatibility:
    name: Java compatibility / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: python -m pip install -r requirements-security.txt -r requirements-code-analysis.txt
      - name: Run Java-related regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

# Live provider E2E and the frozen checkout benchmark require separate
# authorized runners, pinned inputs, and credentials. This CI does not
# represent those checks as passed or publish a release automatically.
