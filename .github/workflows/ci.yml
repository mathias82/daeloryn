name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-security.txt -r requirements-code-analysis.txt
      - name: Validate agent definitions
        run: python scripts/agents.py validate
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  offline-benchmark-suite:
    name: Unified offline benchmark / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-security.txt -r requirements-code-analysis.txt
      - name: Run full offline benchmark suite
        run: python scripts/run_benchmark_suite.py --output benchmark-report.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-benchmark-report
          path: benchmark-report.json
          if-no-files-found: ignore

  java-compatibility:
    name: Java compatibility / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: python -m pip install -r requirements-security.txt -r requirements-code-analysis.txt
      - name: Run Java-related regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker-workflow-integration:
    name: Real Docker workflow / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull and freeze the probe image before offline execution
        id: image
        run: |
          docker pull python:3.11-alpine
          image="$(docker image inspect python:3.11-alpine --format '{{index .RepoDigests 0}}')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Exercise real containers and process restarts without GitHub writes
        env:
          DAELORYN_E2E_IMAGE: ${{ steps.image.outputs.image }}
        run: python -m unittest discover -s integration_tests -p 'test_workflow_docker.py' -v

# Live provider E2E and the frozen checkout benchmark require separate
# authorized runners, pinned inputs, and credentials. This CI does not
# represent those checks as passed or publish a release automatically.
