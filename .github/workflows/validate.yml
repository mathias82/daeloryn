name: Validate agents
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install security test dependencies
        run: python3 -m pip install -r requirements-security.txt
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests
      - name: Validate catalog
        run: python3 scripts/agents.py validate
      - name: Validate platform benchmark reference data
        run: python3 scripts/evaluate_platform.py
      - name: Smoke-test evaluation prompts without running AI agents
        run: python3 scripts/prepare_agent_cases.py docker-root > /dev/null
      - name: Validate orchestration DAGs
        run: python3 scripts/workflows.py --validate-all
      - name: Validate cross-stack engineering reference data
        run: python3 scripts/evaluate_engineering.py
      - name: Confirm unverified release remains blocked
        run: |
          if python3 scripts/check_release_gates.py --evidence docs/release-evidence.example.json; then
            echo 'ERROR: release checker accepted the explicitly unverified example' >&2
            exit 1
          fi
      - name: Run installer tests
        run: python3 -m unittest discover -s tests -v
