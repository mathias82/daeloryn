name: Validate agents
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security test dependencies
        run: python3 -m pip install -r requirements-security.txt
      - name: Validate catalog
        run: python3 scripts/agents.py validate
      - name: Validate platform benchmark reference data
        run: python3 scripts/evaluate_platform.py
      - name: Smoke-test evaluation prompts without running AI agents
        run: python3 scripts/prepare_agent_cases.py docker-root > /dev/null
      - name: Validate orchestration DAGs
        run: python3 scripts/workflows.py --validate-all
      - name: Run installer tests
        run: python3 -m unittest discover -s tests -v
