name: Dependency inventory (SBOM)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Python dependency SBOM
        run: |
          python3 -m pip install cyclonedx-bom
          python3 -m pip install -r requirements-security.txt
          python3 -m cyclonedx_py environment --output-format JSON --output-file sbom.cdx.json
      - name: Upload inventory as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-sbom
          path: sbom.cdx.json
          if-no-files-found: error
