name: Console regression checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/console-checks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/console-checks.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: API and Copilot regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_console_api.py' -v
          python3 -m unittest discover -s tests -p 'test_copilot_chat.py' -v
          python3 -m unittest discover -s tests -p 'test_copilot_auto.py' -v
          python3 -m unittest discover -s tests -p 'test_agent_router.py' -v
          python3 -m unittest discover -s tests -p 'test_repository_router.py' -v
          python3 -m unittest discover -s tests -p 'test_github_repository_catalog.py' -v
          python3 -m unittest discover -s tests -p 'test_project_analysis.py' -v
          python3 -m unittest discover -s tests -p 'test_code_aware.py' -v
          python3 -m unittest discover -s tests -p 'test_architecture_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_review_action_plan.py' -v
          python3 -m unittest discover -s tests -p 'test_engineering_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_copilot_review.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_review_api.py' -v
          python3 -m unittest discover -s tests -p 'test_engineering_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_patch_workspace.py' -v
          python3 -m unittest discover -s tests -p 'test_review_context_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_copilot_console_api.py' -v
          python3 -m unittest discover -s tests -p 'test_local_chat.py' -v
          python3 -m unittest discover -s tests -p 'test_container_test_runner.py' -v
          python3 -m unittest discover -s tests -p 'test_workflow_orchestrator.py' -v
          python3 -m unittest discover -s tests -p 'test_workflow_concurrency.py' -v
          python3 -m unittest discover -s tests -p 'test_workflow_recovery.py' -v
          python3 -m unittest discover -s tests -p 'test_workflow_gates.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_pr_publish.py' -v
          python3 -m unittest discover -s tests -p 'test_execution_approval_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_durable_approval_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_execution_authorization.py' -v
          python3 -m unittest discover -s tests -p 'test_local_bearer_auth.py' -v
          python3 -m unittest discover -s tests -p 'test_authenticated_execution.py' -v
          python3 -m unittest discover -s tests -p 'test_authenticated_container_tests.py' -v
          python3 -m unittest discover -s tests -p 'test_trusted_checkout_registry.py' -v
          python3 -m unittest discover -s tests -p 'test_registered_container_tests.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_execution_dispatch.py' -v
          python3 -m unittest discover -s tests -p 'test_execution_receipts.py' -v
          python3 -m unittest discover -s tests -p 'test_dispatch_receipts.py' -v
          python3 -m unittest discover -s tests -p 'test_production_negative_cases.py' -v
          python3 -m unittest discover -s tests -p 'test_reliable_container_tests.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_pr_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_repair_agent.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_repair_proposal.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_repair_validation.py' -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
